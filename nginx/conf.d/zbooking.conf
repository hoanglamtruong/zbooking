# ============================================================
# HTTP-only — chạy ngay, không cần SSL cert
# Sau khi có cert: chạy  bash enable-https.sh
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name zbooking.zeebee.vn _;

    root /var/www/zbooking;
    index index.html booking-preview.html;

    # Certbot ACME challenge (dùng khi lấy SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # PWA: Service Worker
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires 0;
    }

    # PWA: Manifest
    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/manifest+json; charset=utf-8";
    }

    # Icons
    location ~* \.(png|jpg|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # JS/CSS
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Main — SPA fallback
    location / {
        try_files $uri $uri/ /index.html /booking-preview.html =404;
        add_header Cache-Control "no-cache";
    }

    # Block sensitive files
    location ~* \.(sh|yml|yaml)$ { deny all; }
    location ~ /\. { deny all; }

    access_log /var/log/nginx/zbooking_access.log;
    error_log  /var/log/nginx/zbooking_error.log warn;
}
